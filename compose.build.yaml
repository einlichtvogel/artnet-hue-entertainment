name: artnet-hue-entertainment-local

services:
  bridge:
    image: artnet-hue-entertainment:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    init: true
    network_mode: host
    restart: unless-stopped
    user: "${ARTNET_HUE_UID:-1000}:${ARTNET_HUE_GID:-1000}"
    volumes:
      - ./docker/data/default:/data
    command: ["run", "--config", "/data/config.json"]
