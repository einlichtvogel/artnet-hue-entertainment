name: artnet-hue-entertainment-local

services:
  bridge:
    image: artnet-hue-entertainment:local
    pull_policy: build
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    init: true
    network_mode: host
    restart: "no"
    user: "${ARTNET_HUE_UID:-1000}:${ARTNET_HUE_GID:-1000}"
    working_dir: /data
    entrypoint: ["node", "/app/build/cli.js"]
    volumes:
      - ./:/data
    command: ["run"]
