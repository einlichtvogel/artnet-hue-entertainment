name: artnet-hue-entertainment

services:
  bridge:
    image: ghcr.io/einlichtvogel/artnet-hue-entertainment:latest
    pull_policy: always
    init: true
    network_mode: host
    restart: unless-stopped
    user: "${ARTNET_HUE_UID:-1000}:${ARTNET_HUE_GID:-1000}"
    working_dir: /data
    entrypoint: ["node", "/app/build/cli.js"]
    volumes:
      - ./:/data
    command: ["run"]
